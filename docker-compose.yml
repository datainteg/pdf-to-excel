services:
  mongo:
    image: mongo:7
    container_name: pdf2excel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  pdf2excel-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf2excel-web:latest
    container_name: pdf2excel-web
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    expose:
      - "8082"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pdf2excel
      APP_AUTH_USER: datainteg
      APP_AUTH_PASS: Welcome@911
      SESSION_SECRET: change-this-in-production
    volumes:
      - ./output:/app/output
      - ./pdfs:/app/pdfs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pdf2excel-nginx
    depends_on:
      pdf2excel-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/runtime:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  mongo_data:
