services:
  mongo:
    image: mongo:7
    container_name: pdf2excel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  pdf2excel-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf2excel-web:latest
    container_name: pdf2excel-web
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pdf2excel
      APP_AUTH_USER: datainteg
      APP_AUTH_PASS: Welcome@911
      SESSION_SECRET: change-this-in-production
    volumes:
      - ./output:/app/output
      - ./pdfs:/app/pdfs
    restart: unless-stopped

volumes:
  mongo_data:
